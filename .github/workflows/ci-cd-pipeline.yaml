name: CI/CD Pipeline - Credit Scoring ML

on:
  push:
    branches: [ main, develop, nn_model ]
    paths:
      - 'src/**'
      - 'models/**'
      - 'requirements.txt'
      - 'Dockerfile*'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, develop, nn_model ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

# Environment variables
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_NAMESPACE: ml-serving
  AWS_REGION: ru-central1
  YC_ENDPOINT: https://storage.yandexcloud.net

#    
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      environment: ${{ steps.env.outputs.environment }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check deployment trigger
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event.inputs.environment }}" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate version tag
        id: version
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          DATE=$(date +'%Y%m%d')
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "version=v1.0.$DATE-$SHORT_SHA" >> $GITHUB_OUTPUT
          else
            echo "version=v0.1.$DATE-$SHORT_SHA" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: ./docker_for_nn_model/api/Dockerfile
            context: .
          - image: frontend
            dockerfile: ./docker_for_nn_model/frontend/Dockerfile
            context: .
          - image: model-downloader
            dockerfile: ./docker_for_nn_model/model-downloader/Dockerfile
            context: ./docker_for_nn_model/model-downloader
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.context }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: ${{ !github.event.inputs.skip_tests }}
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock pytest-asyncio
          
      - name: Run unit tests
        run: |
          pytest src/tests/ -v --cov=src --cov-report=xml --cov-report=html
          
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          
      - name: Run ML model tests
        run: |
          python -m pytest tests/model_tests.py -v
          
      - name: Performance benchmark test
        run: |
          python scripts/compare_performance.py --simple --iterations 10
          
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-reports/
            coverage.xml
            htmlcov/

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: [setup, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run SAST with CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        
      - name: Run Bandit security linter
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json
          
      - name: Run dependency check
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          
      - name: Check for secrets in code
        uses: secret-scanner/action@v2.0.0
        with:
          SEVERITY: HIGH
          
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json
            snyk-report.json

  model-validation:
    name: Model Validation
    runs-on: ubuntu-latest
    needs: [setup, test]
    if: ${{ contains(github.event.head_commit.message, '[model-update]') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install evidently mlflow dvc[s3]
          
      - name: Download models from Yandex Storage
        env:
          YC_ACCESS_KEY: ${{ secrets.YC_ACCESS_KEY }}
          YC_SECRET_KEY: ${{ secrets.YC_SECRET_KEY }}
        run: |
          python scripts/download_models.py --bucket credit-scoring-models
          
      - name: Validate model performance
        run: |
          python scripts/validate_model.py \
            --model models/best_model.joblib \
            --threshold 0.75 \
            --metrics accuracy precision recall f1
          
      - name: Run data drift detection
        run: |
          python scripts/detect_drift.py \
            --reference data/train.csv \
            --current data/test.csv \
            --output reports/drift_report.html
          
      - name: Upload validation reports
        uses: actions/upload-artifact@v3
        with:
          name: model-validation-reports
          path: |
            reports/
            validation_results.json

  deploy:
    name: Deploy to ${{ needs.setup.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [setup, build, test, security, model-validation]
    if: ${{ needs.setup.outputs.should_deploy == 'true' && success() }}
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure AWS/Yandex credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.YC_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.YC_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          aws-endpoint: ${{ env.YC_ENDPOINT }}
          
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
          
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 --decode > $HOME/.kube/config
          
      - name: Deploy to Kubernetes
        uses: ./.github/actions/deploy-to-k8s
        with:
          environment: ${{ needs.setup.outputs.environment }}
          image-tag: ${{ needs.build.outputs.image_tag }}
          namespace: ${{ env.K8S_NAMESPACE }}
          
      - name: Run deployment tests
        run: |
          ./scripts/deployment-test.sh \
            --endpoint https://api.${{ needs.setup.outputs.environment }}.credit-scoring.example.com \
            --timeout 300
            
      - name: Upload models to Yandex Storage
        env:
          YC_ACCESS_KEY: ${{ secrets.YC_ACCESS_KEY }}
          YC_SECRET_KEY: ${{ secrets.YC_SECRET_KEY }}
        run: |
          python scripts/upload_models.py \
            --bucket credit-scoring-models \
            --models-dir models/ \
            --environment ${{ needs.setup.outputs.environment }}
            
      - name: Create deployment report
        run: |
          python scripts/create_deployment_report.py \
            --environment ${{ needs.setup.outputs.environment }} \
            --version ${{ needs.setup.outputs.version }} \
            --output deployment-report.md
          
      - name: Send deployment notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: deployments
          SLACK_TITLE: "Deployment Successful"
          SLACK_MESSAGE: "Credit Scoring ML deployed to ${{ needs.setup.outputs.environment }}"
          SLACK_COLOR: "good"

  monitor:
    name: Post-Deployment Monitoring
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ needs.setup.outputs.environment == 'production' && success() }}
    steps:
      - name: Check deployment health
        run: |
          ./scripts/health-check.sh \
            --url https://api.credit-scoring.example.com/health \
            --retries 10 \
            --interval 30
            
      - name: Run performance tests
        run: |
          locust -f locustfile.py \
            --host=https://api.credit-scoring.example.com \
            --users 100 \
            --spawn-rate 10 \
            --run-time 5m \
            --html reports/locust-report.html
            
      - name: Check metrics
        run: |
          python scripts/check_metrics.py \
            --prometheus-url http://prometheus:9090 \
            --queries 'up{job="credit-scoring-api"} == 1' \
            --timeout 300
            
      - name: Upload monitoring reports
        uses: actions/upload-artifact@v3
        with:
          name: monitoring-reports
          path: |
            reports/locust-report.html
            health-check.log
            metrics-report.json
