name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt

      - name: Format check (black)
        run: black --check .

      - name: Lint (flake8)
        run: flake8 .

      - name: Create minimal features CSV for validation
        run: |
          python - <<'PY'
import pandas as pd, numpy as np
n=200
# build a dataset that satisfies expectations.json
df = pd.DataFrame({
  "limit_bal": np.random.randint(10000,1000000,n),
  "age": np.random.randint(21,79,n),
  "avg_bill_amt": np.abs(np.random.normal(1000,300,n)),
  "avg_pay_amt": np.abs(np.random.normal(500,200,n)),
  "bill_pay_ratio": np.clip(np.abs(np.random.normal(0.5,0.5,n)),0,5),
  "num_late_payments": np.random.randint(0,6,n),
  "max_delay": np.random.randint(0,6,n),
  "avg_delay": np.random.rand(n)*3,
  "bill_trend": np.random.normal(0,10,n),
  "age_bin": pd.cut(np.random.randint(21,79,n), bins=[0,30,40,50,60,100], labels=False, include_lowest=True),
  "default_payment_next_month": np.random.randint(0,2,n)
})
from pathlib import Path
Path('data/processed').mkdir(parents=True, exist_ok=True)
df.to_csv('data/processed/credit_data_features.csv', index=False)
print('features CSV written')
PY

      - name: Run data validation (Great Expectations)
        run: python -c "from src.data.validation import validate_features; import json; print(json.dumps(validate_features(raise_on_fail=False), indent=2))"

      - name: Run tests
        run: pytest -q
