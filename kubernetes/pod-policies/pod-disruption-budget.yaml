# Pod Disruption Budget  API
#       :
# -  
# -    
# -  

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: credit-scoring-api-pdb
  namespace: ml-serving
  labels:
    app: credit-scoring-api
spec:
  #  2    
  minAvailable: 2
  
  selector:
    matchLabels:
      app: credit-scoring-api
  
  #      
  unhealthyPodEvictionPolicy: IfHealthyBudget

---
# PodDisruptionBudget   
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: database-pdb
  namespace: ml-serving
  labels:
    app: database
spec:
  #  1     
  minAvailable: 1
  
  selector:
    matchLabels:
      app: database

---
# PodDisruptionBudget  Redis
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: ml-serving
  labels:
    app: redis
spec:
  #  1  Redis   
  minAvailable: 1
  
  selector:
    matchLabels:
      app: redis
