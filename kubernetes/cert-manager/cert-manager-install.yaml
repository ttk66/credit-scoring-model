# Namespace  cert-manager
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    cert-manager.io/disable-validation: "true"

---
# ClusterIssuer  Let's Encrypt Production
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Production Let's Encrypt 
    server: https://acme-v02.api.letsencrypt.org/directory
    email: m.chernikow2018@yandex.ru  #    EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod
    
    # HTTP-01 challenge solver
    solvers:
    - http01:
        ingress:
          class: nginx

---
# ClusterIssuer  Let's Encrypt Staging ( )
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Staging Let's Encrypt  (   )
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: m.chernikow2018@yandex.ru  #    EMAIL
    privateKeySecretRef:
      name: letsencrypt-staging
    
    # HTTP-01 challenge solver
    solvers:
    - http01:
        ingress:
          class: nginx

---
# Certificate  API 
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: credit-scoring-api-cert
  namespace: ml-serving
spec:
  secretName: credit-scoring-api-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: api.credit-scoring.example.com  #    
  dnsNames:
  - api.credit-scoring.example.com
  - "*.api.credit-scoring.example.com"

---
# Certificate  Frontend 
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: credit-scoring-frontend-cert
  namespace: ml-serving
spec:
  secretName: credit-scoring-frontend-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: app.credit-scoring.example.com  #    
  dnsNames:
  - app.credit-scoring.example.com
  - "*.app.credit-scoring.example.com"
