apiVersion: v1
kind: Service
metadata:
  name: credit-scoring-api
  namespace: ml-serving
  labels:
    app: credit-scoring-api
    service: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  selector:
    app: credit-scoring-api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: credit-scoring-api-external
  namespace: ml-serving
  labels:
    app: credit-scoring-api
    service: api-external
spec:
  selector:
    app: credit-scoring-api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  type: LoadBalancer
  loadBalancerIP: 51.250.12.34  #  IP
  externalTrafficPolicy: Local