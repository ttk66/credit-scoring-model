apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ml-serving
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'credit-scoring'
        environment: 'production'

    scrape_configs:
      # API metrics
      - job_name: 'api'
        static_configs:
          - targets: ['api:8000']
        metrics_path: '/metrics'
        scrape_interval: 5s

      # Kubernetes metrics
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - ml-serving
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

      # Node exporter
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']

    # Alert rules
    rule_files:
      - '/etc/prometheus/alert.rules.yml'

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

  alert.rules.yml: |
    groups:
      - name: credit_scoring
        interval: 10s
        rules:
          # API availability
          - alert: APIDown
            expr: up{job="api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "API is down"
              description: "API service is unreachable for 1 minute"

          # High error rate
          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value | humanizePercentage }}"

          # Model inference latency
          - alert: HighInferenceLatency
            expr: histogram_quantile(0.95, rate(model_inference_duration_seconds_bucket[5m])) > 1.0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High model inference latency"
              description: "P95 latency: {{ $value | humanizeDuration }}"

          # Data drift detected
          - alert: DataDriftDetected
            expr: data_drift_detected == 1
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Data drift detected"
              description: "Feature distribution has drifted significantly"

          # Memory usage
          - alert: HighMemoryUsage
            expr: container_memory_usage_bytes{pod=~"api-.*"} / container_spec_memory_limit_bytes > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage"
              description: "Memory usage is {{ $value | humanizePercentage }}"

          # CPU usage
          - alert: HighCPUUsage
            expr: rate(container_cpu_usage_seconds_total{pod=~"api-.*"}[5m]) > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage"
              description: "CPU usage is {{ $value | humanizePercentage }}"

          # Model performance degradation
          - alert: ModelPerformanceDegradation
            expr: model_auc < 0.75
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Model performance degraded"
              description: "AUC score dropped to {{ $value }}"

          # Pod restart loop
          - alert: PodRestartingLoop
            expr: rate(kube_pod_container_status_restarts_total[15m]) > 0.1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod is restarting frequently"
              description: "Pod {{ $labels.pod }} is restarting"
