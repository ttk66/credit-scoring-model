apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: ml-serving
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: 'default'
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h

      routes:
      - match:
          severity: critical
        receiver: 'default'
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 1h
      - match:
          severity: warning
        receiver: 'default'
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 6h

    receivers:
    - name: 'default'
      webhook_configs: []

    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'cluster']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: ml-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.30.1
        args:
          - '--config.file=/etc/alertmanager/alertmanager.yml'
          - '--storage.path=/alertmanager'
        ports:
        - containerPort: 9093
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
        - name: storage
          mountPath: /alertmanager
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9093
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9093
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: ml-serving
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
  - port: 9093
    targetPort: 9093
    name: http
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: ml-serving
type: Opaque
stringData:
  slack_webhook_url: ""
  pagerduty_service_key: ""
