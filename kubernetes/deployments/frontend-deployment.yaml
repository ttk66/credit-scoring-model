---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-scoring-frontend
  namespace: ml-serving
  labels:
    app: credit-scoring-frontend
    component: frontend
    version: v1.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: credit-scoring-frontend
  template:
    metadata:
      labels:
        app: credit-scoring-frontend
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "false"  # Frontend   Prometheus 
    spec:
      serviceAccountName: ml-serving-sa
      terminationGracePeriodSeconds: 30
      containers:
      - name: frontend
        image: cr.yandex/crpn3tq7q9d6m8i8e5vn/credit-scoring-frontend:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: API_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: api-url
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: log-level
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: nginx-config
        configMap:
          name: frontend-nginx-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - credit-scoring-frontend
              topologyKey: kubernetes.io/hostname
