---
# Celery Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-scoring-celery
  namespace: ml-serving
  labels:
    app: credit-scoring-celery
    component: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: credit-scoring-celery
  template:
    metadata:
      labels:
        app: credit-scoring-celery
        component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ml-serving-sa
      terminationGracePeriodSeconds: 60
      containers:
      - name: celery-worker
        image: cr.yandex/crpn3tq7q9d6m8i8e5vn/credit-scoring-api:1.0.0
        imagePullPolicy: IfNotPresent
        command:
        - celery
        - -A
        - src.tasks.celery_app
        - worker
        - --loglevel=info
        - --concurrency=4
        - --pool=prefork
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: connection-string
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: connection-string
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: connection-string
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: connection-string
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: log-level
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - src.tasks.celery_app
            - inspect
            - active
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: logs-volume
          mountPath: /app/logs
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: logs-volume
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - credit-scoring-celery
              topologyKey: kubernetes.io/hostname
