apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-scoring-api
  namespace: ml-serving
  labels:
    app: credit-scoring-api
    component: api
    version: v1.0.0
  annotations:
    kubernetes.io/change-cause: "Deploy version 1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: credit-scoring-api
  template:
    metadata:
      labels:
        app: credit-scoring-api
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include "configmap-checksum" . }}
    spec:
      serviceAccountName: ml-serving-sa
      terminationGracePeriodSeconds: 60
      containers:
      - name: api
        image: cr.yandex/crpn3tq7q9d6m8i8e5vn/credit-scoring-api:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: MODEL_PATH
          value: "/models/credit_scoring.onnx"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: connection-string
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: connection-string
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: log-level
        - name: BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: batch-size
        envFrom:
        - configMapRef:
            name: api-environment
        - secretRef:
            name: api-secrets
        volumeMounts:
        - name: models-volume
          mountPath: /models
          readOnly: true
        - name: config-volume
          mountPath: /app/config
        - name: shared-data
          mountPath: /app/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /startup
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 30
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      initContainers:
      - name: init-model
        image: busybox:1.35
        command: ['sh', '-c', 'until curl -f http://model-storage-service:8080/models/credit_scoring.onnx -o /models/credit_scoring.onnx; do echo "Waiting for model..."; sleep 5; done']
        volumeMounts:
        - name: models-volume
          mountPath: /models
        securityContext:
          runAsUser: 0
      volumes:
      - name: models-volume
        emptyDir: {}
      - name: config-volume
        configMap:
          name: api-config
      - name: shared-data
        persistentVolumeClaim:
          claimName: data-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - credit-scoring-api
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: "node-type"
        operator: "Equal"
        value: "ml-serving"
        effect: "NoSchedule"
      nodeSelector:
        node-type: ml-serving