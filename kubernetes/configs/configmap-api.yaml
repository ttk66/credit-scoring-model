apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: ml-serving
  labels:
    app: credit-scoring-api
data:
  # Конфигурация приложения
  app-config.yaml: |
    api:
      version: "1.0.0"
      name: "Credit Scoring API"
      description: "ML API for credit scoring predictions"
    
    model:
      name: "credit_scoring"
      framework: "onnx"
      input_shape: [1, 32]
      output_shape: [1, 2]
      threshold: 0.5
    
    inference:
      batch_size: 32
      timeout_ms: 5000
      max_requests: 100
    
    monitoring:
      enabled: true
      metrics_port: 9090
      collect_interval: 30
    
    caching:
      enabled: true
      ttl_seconds: 3600
      max_size: 10000
  
  # Переменные окружения
  log-level: "INFO"
  batch-size: "32"
  feature-store-url: "http://feature-store-service:8080"
  model-registry-url: "http://model-registry-service:8080"
  
  # Настройки DVC
  dvc-config: |
    core:
      remote: s3remote
    remote:
      s3remote:
        url: s3://credit-scoring-data/dvc-storage
        endpointurl: https://storage.yandexcloud.net
  
  # Prometheus scrape config
  prometheus-scrape-config: |
    - job_name: 'credit-scoring-api'
      scrape_interval: 30s
      static_configs:
        - targets: ['credit-scoring-api.ml-serving.svc.cluster.local:9090']
          labels:
            service: 'credit-scoring'
            component: 'api'