# Resource Quota  namespace ml-serving
#      namespace
#       DDoS 

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ml-serving-quota
  namespace: ml-serving
spec:
  #   CPU  Memory requests
  hard:
    requests.cpu: "20"          # 20 CPU cores
    requests.memory: "40Gi"     # 40 GB RAM
    limits.cpu: "40"            # 40 CPU cores ()
    limits.memory: "80Gi"       # 80 GB RAM ()
    
    #  pods
    pods: "100"
    
    #  PVC
    persistentvolumeclaims: "10"
    
    #  
    services: "10"
    
    #  configmaps
    configmaps: "50"
    
    #  secrets
    secrets: "50"
    
    # GPU ( )
    "limits.nvidia.com/gpu": "4"
    
    # Requests  GPU
    "requests.nvidia.com/gpu": "2"
  
  # Scope (     pods)
  scopeSelector:
    matchExpressions:
    #    pods  BestEffort QoS
    - operator: NotIn
      scopeName: Terminating
      values: ["active"]

---
# Resource Quota  Compute  ml-serving
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ml-serving-compute-quota
  namespace: ml-serving
spec:
  hard:
    # CPU requests/limits
    requests.cpu: "16"
    limits.cpu: "32"
    
    # Memory requests/limits
    requests.memory: "32Gi"
    limits.memory: "64Gi"
  
  #    pods  Guaranteed QoS class
  scopeSelector:
    matchExpressions:
    - operator: In
      scopeName: PriorityClass
      values: ["production"]

---
# Network Policy Quota (   )
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ml-serving-network-quota
  namespace: ml-serving
spec:
  hard:
    #   LoadBalancer
    "services.loadbalancers": "2"
    
    # Services  NodePort
    "services.nodeports": "2"
    
    # Ingress
    "ingresses.networking.k8s.io": "5"

---
# Default Resource Quota  namespace ml-serving
#    pods    requests/limits
apiVersion: v1
kind: LimitRange
metadata:
  name: ml-serving-limits
  namespace: ml-serving
spec:
  limits:
  #  
  - type: Container
    default:
      # Default limits (  )
      memory: "512Mi"
      cpu: "500m"
    defaultRequest:
      # Default requests (  )
      memory: "256Mi"
      cpu: "250m"
    min:
      #  
      memory: "64Mi"
      cpu: "10m"
    max:
      #  
      memory: "2Gi"
      cpu: "2"
  
  #  pods
  - type: Pod
    min:
      memory: "64Mi"
      cpu: "10m"
    max:
      memory: "4Gi"
      cpu: "4"
  
  #  PVC
  - type: PersistentVolumeClaim
    min:
      storage: "1Gi"
    max:
      storage: "100Gi"

---
# Network Policy Quota   
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ml-serving-network-limit
  namespace: ml-serving
spec:
  #    pods  namespace
  podSelector: {}
  
  policyTypes:
  - Ingress
  - Egress
  
  #  
  ingress:
  #  ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 9090
  
  #  
  egress:
  # DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  
  #    namespace
  - to:
    - podSelector: {}
  
  #  (HTTPS  HTTP)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
