apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: credit-scoring-ingress
  namespace: ml-serving
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/client-body-buffer-size: "16k"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-XSS-Protection: 1; mode=block";
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/acme-challenge-type: "http01"
spec:
  tls:
  - hosts:
    - api.credit-scoring.example.com
    - app.credit-scoring.example.com
    secretName: credit-scoring-tls
  rules:
  - host: api.credit-scoring.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: credit-scoring-api
            port:
              number: 80
        path: /health
        pathType: Exact
        backend:
          service:
            name: credit-scoring-api
            port:
              number: 80
        path: /metrics
        pathType: Exact
        backend:
          service:
            name: credit-scoring-api
            port:
              number: 9090
        path: /docs
        pathType: Prefix
        backend:
          service:
            name: credit-scoring-api
            port:
              number: 80
        path: /redoc
        pathType: Exact
        backend:
          service:
            name: credit-scoring-api
            port:
              number: 80
  - host: app.credit-scoring.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: credit-scoring-frontend
            port:
              number: 80