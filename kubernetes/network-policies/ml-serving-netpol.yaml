---
# Network Policy     namespace ml-serving
# :
# 1.   ingress controller  API pods
# 2.   pods  namespace
# 3.      downloads
# :
# 1.    namespaces
# 2.   

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ml-serving-default-deny
  namespace: ml-serving
  labels:
    app: network-policy
    version: v1
spec:
  #      namespace
  podSelector: {}
  
  #      
  policyTypes:
  - Ingress
  
  #     ingress 
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system

---
# Network Policy  API deployment
#     ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: credit-scoring-api-allow-ingress
  namespace: ml-serving
  labels:
    app: network-policy
    service: credit-scoring-api
spec:
  podSelector:
    matchLabels:
      app: credit-scoring-api
  
  policyTypes:
  - Ingress
  - Egress
  
  #  
  ingress:
  #  Nginx Ingress Controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
      name: http
    - protocol: TCP
      port: 9090
      name: metrics
  
  #  Prometheus  kube-system   
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9090
      name: metrics
  
  #   pods    namespace ( - )
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 9090
  
  #  
  egress:
  #  DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  
  #       namespace
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 5432  # Database
    - protocol: TCP
      port: 6379  # Redis
  
  #      (  , )
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443  # HTTPS
    - protocol: TCP
      port: 80   # HTTP

---
# Network Policy   
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-allow-api
  namespace: ml-serving
  labels:
    app: network-policy
    service: database
spec:
  podSelector:
    matchLabels:
      app: database
  
  policyTypes:
  - Ingress
  
  #     API
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: credit-scoring-api
    ports:
    - protocol: TCP
      port: 5432

---
# Network Policy  Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-api
  namespace: ml-serving
  labels:
    app: network-policy
    service: redis
spec:
  podSelector:
    matchLabels:
      app: redis
  
  policyTypes:
  - Ingress
  
  #     API
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: credit-scoring-api
    ports:
    - protocol: TCP
      port: 6379

---
# Network Policy      namespaces
# (   default-deny,     )
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-other-namespaces
  namespace: ml-serving
  labels:
    app: network-policy
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  
  #  -    (   )
  ingress: []
