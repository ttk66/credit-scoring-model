version: '3.8'

services:
  # PostgreSQL   
  postgres:
    image: postgres:15-alpine
    container_name: credit_scoring_db
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-credit_scoring}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ml-network

  # Redis    Celery
  redis:
    image: redis:7-alpine
    container_name: credit_scoring_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ml-network

  # ML API 
  api:
    build:
      context: ../api
      dockerfile: docker/api/Dockerfile
    container_name: credit_scoring_api
    environment:
      - DATABASE_URL=postgresql://admin:secret@postgres:5432/credit_scoring
      - REDIS_URL=redis://:redispass@redis:6379/0
      - MODEL_PATH=/app/models/credit_scoring.onnx
      - LOG_LEVEL=INFO
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data:ro
      - api_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ml-network

  # Celery worker   
  celery-worker:
    build:
      context: ../api
      dockerfile: docker/api/Dockerfile
    container_name: credit_scoring_celery
    command: celery -A src.tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://admin:secret@postgres:5432/credit_scoring
      - REDIS_URL=redis://:redispass@redis:6379/0
      - CELERY_BROKER_URL=redis://:redispass@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:redispass@redis:6379/0
    volumes:
      - ../data:/app/data
      - worker_logs:/app/logs
    depends_on:
      - redis
      - postgres
    networks:
      - ml-network

  # Data loader  DVC
  data-loader:
    build:
      context: ../data-loader
      dockerfile: docker/data-loader/Dockerfile
    container_name: credit_scoring_data_loader
    environment:
      - DVC_ACCESS_KEY=${DVC_ACCESS_KEY}
      - DVC_SECRET_KEY=${DVC_SECRET_KEY}
      - DATABASE_URL=postgresql://admin:secret@postgres:5432/credit_scoring
    volumes:
      - ../data:/app/data
      - dvc_cache:/app/.dvc/cache
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ml-network

  # Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: docker/frontend/Dockerfile
    container_name: credit_scoring_frontend
    ports:
      - "8080:8080"
    depends_on:
      - api
    networks:
      - ml-network

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: credit_scoring_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - ml-network

  grafana:
    image: grafana/grafana:10.1.0
    container_name: credit_scoring_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - ml-network

volumes:
  postgres_data:
  redis_data:
  api_logs:
  worker_logs:
  dvc_cache:
  prometheus_data:
  grafana_data:

networks:
  ml-network:
    driver: bridge