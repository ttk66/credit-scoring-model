core:
  remote: s3remote
  autostage: true

remote:
  s3remote:
    url: s3://credit-scoring-data/dvc-storage
    endpointurl: https://storage.yandexcloud.net
    access_key_id: ${DVC_ACCESS_KEY}
    secret_access_key: ${DVC_SECRET_KEY}
  
cache:
  dir: .dvc/cache
  type: reflink,symlink,hardlink,copy
  
state:
  row_limit: 10000
  row_cleanup_quota: 1000